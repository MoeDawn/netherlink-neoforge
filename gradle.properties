# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true

# 环境属性（版本在 https://projects.neoforged.net/neoforged/neoforge 查，
# 或看官方 MDK 的对应分支 github.com/neoforgemdks/MDK-26.3-ModDevGradle）
minecraft_version=26.3
minecraft_version_range=[26.3]
# ⚠️ 26.3 目前是 beta。开发可以，**发布前确认有没有更稳的版本**。
neo_version=26.3.0.23-beta

# ModDevGradle 插件版本（照抄官方 MDK 的 build.gradle）
moddev_version=2.0.147

# Mod 属性
mod_id=netherlink
mod_name=NetherLink
mod_license=MIT
# ⚠️ 与 Fabric 端各自独立编号，**未获用户明确指示不得改动**。
mod_version=0.0.1
mod_group_id=dev.eyf
